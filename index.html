<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
}

/* Mematikan semua transisi dan animasi di seluruh Beranda */
#home, #home *, #home::before, #home::after, #home *::before, #home *::after,
#main > section:has(#home) {
  animation: none !important;
  -webkit-animation: none !important;
  animation-delay: 0s !important;
  transition: none !important;
  -webkit-transition: none !important;
  transform: none !important;
  -webkit-transform: none !important;
  opacity: 1 !important;
}

body {
  margin: 0;
  background: #f5f8f5;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: #193022;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  background: #fff;
  box-shadow: 0 0 30px rgba(0,0,0,0.06);
}

.gradient {
  background: #0F3822;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) !important;
  width: min(520px, 100%);
  z-index: 50;
  background: #0F3822 !important;
  border-radius: 22px 22px 0 0;
  padding: 8px 8px max(8px, env(safe-area-inset-bottom));
}

.nav button {
  color: #b7cbb9;
  min-height: 54px;
  border: none;
  background: transparent;
  font-size: 11px;
  font-weight: 700;
  outline: none;
}

.nav .ico {
  width: 44px;
  height: 44px;
  margin: 0 auto 3px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav .ico i, .nav .ico svg {
  width: 22px;
  height: 22px;
}

.nav button.active {
  color: #fff;
  font-weight: 800;
}

.nav button.active .ico {
  background: #B8EE62;
  color: #0F3822;
}

/* Dashboard Card Baru sesuai Referensi Gambar */
#home-app-card {
  position: relative;
  width: 100%;
  padding: 24px 22px;
  border-radius: 28px;
  background: radial-gradient(circle at top right, #1f5737 0%, #113d25 50%, #0c2e1b 100%);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 16px 36px rgba(15,56,34,0.24);
  color: #fff;
  box-sizing: border-box;
  overflow: hidden;
}

/* Lingkaran aksen lengkung abstrak di latar belakang kartu */
#home-app-card::before {
  content: "";
  position: absolute;
  top: -60px;
  right: -60px;
  width: 220px;
  height: 220px;
  border: 1px solid rgba(184, 238, 98, 0.12);
  border-radius: 50%;
  pointer-events: none;
}
#home-app-card::after {
  content: "";
  position: absolute;
  bottom: -80px;
  right: -40px;
  width: 260px;
  height: 260px;
  border: 1px solid rgba(184, 238, 98, 0.08);
  border-radius: 50%;
  pointer-events: none;
}

#home-app-card .home-app-card-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  font-weight: 800;
  color: #B8EE62;
  text-transform: uppercase;
}

#home-app-card .home-app-card-title {
  margin: 14px 0 10px;
  font-size: 28px;
  line-height: 1.15;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: -0.02em;
}

#home-app-card .home-app-card-title span {
  color: #B8EE62;
}

#home-app-card .home-app-card-quote {
  margin: 0 0 18px;
  font-size: 12px;
  line-height: 1.5;
  font-weight: 500;
  color: rgba(255,255,255,0.85);
  max-width: 92%;
}

#home-app-card .home-app-card-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(18, 59, 36, 0.75);
  border: 1px solid rgba(184, 238, 98, 0.3);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  color: #ffffff;
  backdrop-filter: blur(4px);
}

#home-app-card .home-app-card-status-dot {
  width: 8px;
  height: 8px;
  background: #B8EE62;
  border-radius: 50%;
  box-shadow: 0 0 8px #B8EE62;
}

/* Custom Input & Card styling */
.tx-item { border: 1px solid #b7e4bc; border-radius: 16px; padding: 14px; background: #fff; }
.tx-item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tx-item-grid .full { grid-column: 1 / -1; }
.tx-summary { background: #e8f7ea; border: 1px solid #b7e4bc; border-radius: 14px; padding: 12px; font-size: 12px; }
.tx-history-card { border: 1px solid #d9eadb; border-radius: 16px; padding: 14px; background: #fff; }
.tx-history-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; font-size: 10px; }
.tx-history-label { color: #66816b; font-size: 9px; font-weight: 700; }
.tx-history-value { font-weight: 800; color: #0F3822; font-size: 11px; }

/* Calculator Keypad */
.calc-btn { min-height: 54px; font-size: 19px; font-weight: 800; border-radius: 14px; border: 1px solid #d6e8d8; background: #fff; }
.calc-op { background: #dff5e2; border-color: #b7e4bc; font-size: 20px; }
.calc-eq { background: #52ad60; color: #fff; border-color: #52ad60; font-size: 20px; }
.calc-danger { background: #e8f7ea; color: #438f4f; }

input, select, textarea {
  outline: none;
  font-weight: 700 !important;
}
input::placeholder, textarea::placeholder {
  color: #a0aba3 !important;
  font-weight: 600 !important;
}

/* Toast */
#toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: #0F3822;
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  white-space: nowrap;
}

/* PDF Printable Layout Styling A4 */
.pdf-a4-container {
  background: #ffffff;
  color: #111827;
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 18px;
  font-size: 11px;
}
.pdf-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 10px;
}
.pdf-table th, .pdf-table td {
  border: 1px solid #d1d5db;
  padding: 6px 8px;
  text-align: left;
}
.pdf-table th {
  background-color: #0F3822;
  color: #ffffff;
  font-weight: 800;
  text-transform: uppercase;
  font-size: 9px;
}
.pdf-table tr:nth-child(even) {
  background-color: #f9fafb;
}

@keyframes blink-cursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.calc-cursor {
  animation: blink-cursor 1s infinite;
}

/* Judul Katalog & Riwayat tetap terlihat saat kembali dari pencarian */
#catalog > .flex.justify-between.items-center,
#history > .flex.justify-between.items-center {
  position: relative;
  z-index: 2;
  flex-shrink: 0;
}
#catalog #searchBox,
#history #historySearchBox {
  position: relative;
  z-index: 1;
}
/* ===== SUPABASE LOGIN ===== */
body.auth-locked .app { display:none !important; }
#authScreen {
  position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
  padding:20px; background:#f5f8f5; font-family:'Plus Jakarta Sans',sans-serif;
}
#authScreen.hidden { display:none; }
.auth-card {
  width:min(420px,100%); background:#fff; border-radius:24px; padding:24px;
  box-shadow:0 18px 50px rgba(15,56,34,.14); border:1px solid #d9eadb;
}
.auth-logo { width:78px; height:78px; object-fit:contain; display:block; margin:0 auto 12px; }
.auth-title { text-align:center; color:#0F3822; font-size:22px; font-weight:900; margin:0; }
.auth-sub { text-align:center; color:#66816b; font-size:12px; margin:6px 0 20px; }
.auth-input { width:100%; border:1px solid #cfe2d2; border-radius:14px; padding:13px 14px; margin-top:9px; font-size:14px; }
.auth-btn:active {
  transform: scale(0.97);
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
}

.auth-btn { width:100%; border:0; border-radius:14px; padding:13px 14px; margin-top:12px; background:#0F3822; color:#fff; font-weight:800; }
.auth-note { font-size:10px; color:#78907c; text-align:center; margin-top:14px; line-height:1.5; }
#authError { color:#b42318; font-size:11px; font-weight:700; margin-top:10px; text-align:center; }
#accountBar { position:fixed; top:8px; right:max(8px, calc((100vw - 520px)/2 + 8px)); z-index:45; display:flex; align-items:center; gap:6px; }
#accountBar button, #logoutBtn { border:0; border-radius:999px; padding:7px 10px; background:rgba(255,255,255,.16); color:#fff; font-size:10px; font-weight:800; cursor:pointer; transition:all .2s ease; }
#accountBar button:hover, #logoutBtn:hover { background:rgba(255,255,255,.24); transform:scale(1.05); }
#accountBar button:active, #logoutBtn:active { transform:scale(0.98); }
#logoutBtn { background:rgba(220, 38, 38, 0.8); }
#logoutBtn:hover { background:rgba(220, 38, 38, 1); }
@media (max-width:520px){ #accountBar { right:8px; } }

.password-wrap{position:relative;display:flex;align-items:center}
.password-wrap input{width:100%;padding-right:48px}
.password-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center}
.password-toggle:active{background:rgba(0,0,0,.06)}

</style>

<style id="NUSA-REFRESH-LOGO-SPLASH">
/* Saat refresh, tampilkan identitas NUsa Percetakan pada latar putih,
   bukan halaman kosong/putih atau halaman login/beranda yang berkedip. */
#nusaRefreshSplash{
  position:fixed;
  inset:0;
  z-index:2147483647;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff;
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transition:opacity .16s ease, visibility .16s ease;

  visibility:hidden;
  pointer-events:none;
}
#nusaRefreshSplash img{
  width:200px;
  height:200px;
  object-fit:contain;
  display:block;
}

  #nusaRefreshSplash{transition:none}

<div id="toast"></div>

<script>
// Toast notification
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

// Logout function
function handleLogout() {
  if (confirm('Apakah Anda yakin ingin logout?')) {
    localStorage.removeItem('supabase_auth_token');
    localStorage.removeItem('supabase_user');
    location.reload();
  }
}

// Setup logout button
document.addEventListener('DOMContentLoaded', () => {
  const logoutBtn = document.getElementById('logoutBtn');
  const userEmailBtn = document.getElementById('userEmailBtn');
  
  logoutBtn.addEventListener('click', handleLogout);
  
  // Check if user is logged in and show buttons
  const user = localStorage.getItem('supabase_user');
  if (user) {
    try {
      const userData = JSON.parse(user);
      logoutBtn.style.display = 'block';
      if (userData.email) {
        userEmailBtn.textContent = userData.email.substring(0, 3) + '...';
        userEmailBtn.style.display = 'block';
      }
    } catch (e) {
      console.error('Error parsing user data:', e);
    }
  }
});

// Lucide icons setup
lucide.createIcons();
</script>
