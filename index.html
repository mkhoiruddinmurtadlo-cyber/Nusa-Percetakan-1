<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="msapplication-TileColor" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Nusa Percetakan">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
<link rel="preload" as="image" href="./logo.png">

<title>Keuangan NUsa Percetakan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f8f5;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: #193022;
  -webkit-tap-highlight-color: transparent;
}

.app {
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  background: #fff;
  box-shadow: 0 0 30px rgba(0,0,0,0.06);
}

.gradient {
  background: #0F3822;
}

.nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) !important;
  width: min(520px, 100%);
  z-index: 50;
  background: #0F3822 !important;
  border-radius: 22px 22px 0 0;
  padding: 8px 8px max(8px, env(safe-area-inset-bottom));
}

.nav button {
  color: #b7cbb9;
  min-height: 54px;
  border: none;
  background: transparent;
  font-size: 11px;
  font-weight: 700;
  outline: none;
}

.nav .ico {
  width: 44px;
  height: 44px;
  margin: 0 auto 3px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav .ico i, .nav .ico svg {
  width: 22px;
  height: 22px;
}

.nav button.active {
  color: #fff;
  font-weight: 800;
}

.nav button.active .ico {
  background: #B8EE62;
  color: #0F3822;
}

/* Auth Screen */
body.auth-locked .app { display:none !important; }
#authScreen {
  position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
  padding:20px; background:#f5f8f5; font-family:'Plus Jakarta Sans',sans-serif;
}
#authScreen.hidden { display:none; }
.auth-card {
  width:min(420px,100%); background:#fff; border-radius:24px; padding:24px;
  box-shadow:0 18px 50px rgba(15,56,34,.14); border:1px solid #d9eadb;
}
.auth-logo { width:78px; height:78px; object-fit:contain; display:block; margin:0 auto 12px; }
.auth-title { text-align:center; color:#0F3822; font-size:22px; font-weight:900; margin:0; }
.auth-sub { text-align:center; color:#66816b; font-size:12px; margin:6px 0 20px; }
.auth-input { width:100%; border:1px solid #cfe2d2; border-radius:14px; padding:13px 14px; margin-top:9px; font-size:14px; font-weight:700; }
.auth-btn:active {
  transform: scale(0.97);
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
}
.auth-btn { width:100%; border:0; border-radius:14px; padding:13px 14px; margin-top:12px; background:#0F3822; color:#fff; font-weight:800; cursor:pointer; }
.auth-note { font-size:10px; color:#78907c; text-align:center; margin-top:14px; line-height:1.5; }
#authError { color:#b42318; font-size:11px; font-weight:700; margin-top:10px; text-align:center; }

/* Account Bar */
#accountBar { 
  position:fixed; 
  top:8px; 
  right:max(8px, calc((100vw - 520px)/2 + 8px)); 
  z-index:45; 
  display:flex; 
  align-items:center; 
  gap:6px; 
}
#accountBar button, #logoutBtn { 
  border:0; 
  border-radius:999px; 
  padding:7px 10px; 
  background:rgba(255,255,255,.16); 
  color:#fff; 
  font-size:10px; 
  font-weight:800; 
  cursor:pointer; 
  transition:all .2s ease; 
}
#accountBar button:hover, #logoutBtn:hover { 
  background:rgba(255,255,255,.24); 
  transform:scale(1.05); 
}
#accountBar button:active, #logoutBtn:active { 
  transform:scale(0.98); 
}
#logoutBtn { 
  background:rgba(220, 38, 38, 0.8); 
}
#logoutBtn:hover { 
  background:rgba(220, 38, 38, 1); 
}
@media (max-width:520px){ 
  #accountBar { right:8px; } 
}

.password-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.password-wrap input{
  width:100%;
  padding-right:48px;
}
.password-toggle{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.password-toggle:active{
  background:rgba(0,0,0,.06);
}

/* Toast */
#toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: #0F3822;
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  white-space: nowrap;
  display: none;
}

/* Refresh Splash */
#nusaRefreshSplash{
  position:fixed;
  inset:0;
  z-index:2147483647;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffffff;
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transition:opacity .16s ease, visibility .16s ease;
}
#nusaRefreshSplash.nusa-refresh-splash-hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#nusaRefreshSplash img{
  width:200px;
  height:200px;
  object-fit:contain;
  display:block;
}

/* Header */
.app > header.gradient {
  height: 60px !important;
  min-height: 60px !important;
  max-height: 60px !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  display: flex !important;
  align-items: center !important;
  padding-left: 16px !important;
  padding-right: 16px !important;
}
.app > header.gradient h1 {
  line-height: 1.08 !important;
  gap: 6px !important;
}
.app > header.gradient p {
  margin-top: 3px !important;
  line-height: 1.15 !important;
  font-size: 10px !important;
}
</style>

</head>
<body>

<div id="nusaRefreshSplash">
  <img src="./logo.png" alt="Nusa Percetakan">
</div>

<!-- Account Bar with Logout -->
<div id="accountBar">
  <button id="userEmailBtn" style="display:none;">📧</button>
  <button id="logoutBtn" style="display:none;">Logout</button>
</div>

<!-- Auth Screen -->
<div id="authScreen">
  <div class="auth-card">
    <img class="auth-logo" src="./logo.png" alt="Logo">
    <h2 class="auth-title">Nusa Percetakan</h2>
    <p class="auth-sub">Sistem Manajemen Keuangan</p>
    
    <label style="display:block; color:#0F3822; font-size:11px; font-weight:700; margin-top:10px;">Email</label>
    <input type="email" id="authEmail" class="auth-input" placeholder="Masukkan email Anda">
    
    <label style="display:block; color:#0F3822; font-size:11px; font-weight:700; margin-top:10px;">Password</label>
    <div class="password-wrap">
      <input type="password" id="authPassword" class="auth-input" placeholder="Masukkan password Anda">
      <button type="button" class="password-toggle" id="togglePassword">👁️</button>
    </div>
    
    <button class="auth-btn" id="loginBtn">Masuk</button>
    <p class="auth-note">Login dengan akun Supabase Anda untuk mengakses aplikasi.</p>
    <div id="authError"></div>
  </div>
</div>

<!-- Main App -->
<div class="app" style="display:none;">
  <header class="gradient flex items-center justify-between px-4 py-3">
    <div>
      <h1 class="text-white font-black text-lg flex items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 11l4-4m0 0l4 4m-4-4v4"></path></svg>
        Nusa Percetakan
      </h1>
      <p class="text-green-200 text-xs">Sistem Manajemen Keuangan</p>
    </div>
  </header>

  <main id="main" class="pb-24 px-4">
    <p style="text-align: center; color: #0F3822; margin-top: 20px;">Loading...</p>
  </main>

  <nav class="nav">
    <button data-page="home" class="active">
      <div class="ico"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 11l4-4m0 0l4 4m-4-4v4"></path></svg></div>
      <span class="label">Beranda</span>
    </button>
    <button data-page="catalog">
      <div class="ico"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C6.5 6.253 2 10.998 2 17s4.5 10.747 10 10.747c5.5 0 10-4.998 10-10.747S17.5 6.253 12 6.253z"></path></svg></div>
      <span class="label">Katalog</span>
    </button>
    <button data-page="calculator">
      <div class="ico"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg></div>
      <span class="label">Kalkulator</span>
    </button>
    <button data-page="history">
      <div class="ico"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></div>
      <span class="label">Riwayat</span>
    </button>
    <button data-page="settings">
      <div class="ico"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></div>
      <span class="label">Pengaturan</span>
    </button>
  </nav>
</div>

<div id="toast"></div>

<script>
// Sembunyikan splash screen
window.addEventListener('load', () => {
  const splash = document.getElementById('nusaRefreshSplash');
  if (splash) {
    setTimeout(() => {
      splash.classList.add('nusa-refresh-splash-hide');
    }, 500);
  }
});

// Toast notification
function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 2000);
}

// Logout function
function handleLogout() {
  if (confirm('Apakah Anda yakin ingin logout?')) {
    localStorage.removeItem('supabase_auth_token');
    localStorage.removeItem('supabase_user');
    location.reload();
  }
}

// Setup logout button
document.addEventListener('DOMContentLoaded', () => {
  try {
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmailBtn = document.getElementById('userEmailBtn');
    const authScreen = document.getElementById('authScreen');
    const app = document.querySelector('.app');
    
    if (!logoutBtn || !userEmailBtn || !authScreen || !app) {
      console.error('DOM elements not found');
      return;
    }
    
    logoutBtn.addEventListener('click', handleLogout);
    
    // Check if user is logged in and show buttons
    const user = localStorage.getItem('supabase_user');
    if (user) {
      try {
        const userData = JSON.parse(user);
        logoutBtn.style.display = 'block';
        if (userData.email) {
          userEmailBtn.textContent = userData.email.substring(0, 3) + '...';
          userEmailBtn.style.display = 'block';
        }
        // Show app, hide auth
        app.style.display = 'block';
        authScreen.classList.add('hidden');
      } catch (e) {
        console.error('Error parsing user data:', e);
        authScreen.classList.remove('hidden');
        app.style.display = 'none';
      }
    } else {
      // Show auth, hide app
      authScreen.classList.remove('hidden');
      app.style.display = 'none';
    }
    
  } catch (e) {
    console.error('Error in DOMContentLoaded:', e);
  }
});

// Toggle password visibility
document.addEventListener('DOMContentLoaded', () => {
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('authPassword');
  
  if (toggleBtn && passwordInput) {
    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });
  }
});

// Login handler
document.addEventListener('DOMContentLoaded', () => {
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) {
    loginBtn.addEventListener('click', () => {
      const email = document.getElementById('authEmail')?.value;
      const password = document.getElementById('authPassword')?.value;
      
      if (!email || !password) {
        const errorDiv = document.getElementById('authError');
        if (errorDiv) errorDiv.textContent = 'Email dan password harus diisi';
        return;
      }
      
      // Simpan user data (demo)
      localStorage.setItem('supabase_user', JSON.stringify({ email }));
      localStorage.setItem('supabase_auth_token', 'token_' + Date.now());
      
      location.reload();
    });
  }
});
</script>

</body>
</html>
